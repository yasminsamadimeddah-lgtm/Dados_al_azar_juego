<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Jugador</title>
    <style>
        body {
            background-color: #8c8ea7;
            font-family: monospace, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .form-container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            width: 450px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.15);
        }
        h2 {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 25px;
            color: #000;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label.field-label {
            display: block;
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 6px;
            color: #000;
        }
        input[type="text"], input[type="number"], input[type="file"] {
            width: 100%;
            padding: 8px 10px;
            box-sizing: border-box;
            border: 1px solid #d0d0d0;
            border-radius: 5px;
            font-family: inherit;
            font-size: 14px;
            background-color: #fafafa;
        }
        fieldset {
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            margin-bottom: 18px;
            padding: 10px 15px;
            background-color: #fff;
        }
        legend {
            font-weight: bold;
            font-size: 14px;
            padding: 0 4px;
            color: #000;
        }
        .checkbox-group label, .radio-group label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin: 4px 0;
            cursor: pointer;
        }
        .checkbox-group input, .radio-group input {
            margin-right: 8px;
            accent-color: #e64a19;
        }
        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .btn {
            padding: 8px 18px;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-submit, .btn-reset {
            background-color: #007bff;
        }
        .btn-submit:hover, .btn-reset:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Formulario de Jugador</h2>
    <form action="index.php" method="POST" enctype="multipart/form-data">
        
        <div class="form-group">
            <label class="field-label" for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required>
        </div>

        <div class="form-group">
            <label class="field-label" for="alias">Alias:</label>
            <input type="text" id="alias" name="alias" required>
        </div>

        <div class="form-group">
            <label class="field-label" for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" min="1" max="120" required>
        </div>

        <fieldset class="checkbox-group">
            <legend>Armas a elegir (puedes elegir varias):</legend>
            <label><input type="checkbox" name="armas[]" value="Maza"> Maza</label>
            <label><input type="checkbox" name="armas[]" value="Antorcha"> Antorcha</label>
            <label><input type="checkbox" name="armas[]" value="Martillo"> Martillo</label>
            <label><input type="checkbox" name="armas[]" value="Látigo"> Látigo</label>
        </fieldset>

        <fieldset class="radio-group">
            <legend>¿Practica artes mágicas?</legend>
            <label><input type="radio" name="magia" value="Sí" required> Sí</label>
            <label><input type="radio" name="magia" value="No"> No</label>
        </fieldset>

        <div class="form-group">
            <label class="field-label" for="imagen">Subir imagen:</label>
            <!-- Permite PNG, JPG, JPEG y JPE -->
            <input type="file" id="imagen" name="imagen" accept=".png, .jpg, .jpeg, .jpe, image/png, image/jpeg">
        </div>

        <div class="buttons">
            <button type="submit" class="btn btn-submit">Enviar</button>
            <button type="reset" class="btn btn-reset">Borrar</button>
        </div>

    </form>
</div>

</body>
</html>
